<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="author" content="APKMASON" />
    <meta
      name="description"
      content="Five fruits. One current. Discover APKMASON Fruit Energy — a fictional 330 ml multifruit energy drink shaped by color."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://apkmason.dev/fruit/" />
    <link rel="icon" type="image/svg+xml" href="fruit-icon.svg" />
    <link rel="manifest" href="site.webmanifest" />

    <!-- Hero art is the LCP candidate; both are discovered late because React renders them. -->
    <link rel="preload" as="image" type="image/webp" href="apkmason-can.webp" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="hero-fruit-frame.webp" fetchpriority="high" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="APKMASON" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://apkmason.dev/fruit/" />
    <meta property="og:title" content="APKMASON Fruit Energy — Shaped by Color" />
    <meta
      property="og:description"
      content="Five fruits. One current. A fictional 330 ml multifruit energy drink shaped by color."
    />
    <meta property="og:image" content="https://apkmason.dev/fruit/og.png" />
    <meta property="og:image:width" content="1729" />
    <meta property="og:image:height" content="910" />
    <meta property="og:image:alt" content="APKMASON Fruit Energy — Shaped by Color" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="APKMASON Fruit Energy — Shaped by Color" />
    <meta
      name="twitter:description"
      content="Five fruits. One current. A fictional 330 ml multifruit energy drink shaped by color."
    />
    <meta name="twitter:image" content="https://apkmason.dev/fruit/og.png" />

    <title>APKMASON Fruit Energy — Shaped by Color</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "APKMASON Fruit Energy — Spectrum 01",
        "description": "A fictional lightly sparkling multifruit energy drink with ruby grapefruit, mango, dragon fruit, lime and red berry.",
        "url": "https://apkmason.dev/fruit/",
        "brand": { "@type": "Brand", "name": "APKMASON" },
        "category": "Energy drink",
        "model": "Spectrum 01 / Ruby Mango",
        "size": "330 ml",
        "additionalProperty": [
          { "@type": "PropertyValue", "name": "Caffeine", "value": "32 mg / 100 ml" },
          { "@type": "PropertyValue", "name": "Added sugar", "value": "0 g" },
          { "@type": "PropertyValue", "name": "Fruit blend", "value": "5 fruits" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This experience needs JavaScript to synchronize the film with your scroll.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
